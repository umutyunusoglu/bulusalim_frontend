name: Android Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Google Play after build
        required: true
        type: boolean
        default: true
      track:
        description: Google Play track
        required: true
        type: choice
        default: internal
        options:
          - internal
          - beta
          - production
  push:
    branches:
      - ci-config
      - main
      - release

permissions:
  contents: read

concurrency:
  group: android-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Create .env
        run: |
          printf "MAPBOX_ACCESS_TOKEN=%s\n" "${{ secrets.MAPBOX_ACCESS_TOKEN }}" > .env

      - name: Install Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare Android signing files
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] || [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEYPASSWORD }}" ]; then
            echo "Missing Android signing secrets."
            echo "Required: ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD, KEYPASSWORD"
            exit 1
          fi

          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEYPASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=app/upload-keystore.jks
          EOF

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Determine Google Play track
        id: track
        run: |
          if [ "${{ github.ref }}" = "refs/heads/release" ]; then
            echo "value=production" >> $GITHUB_OUTPUT
          else
            echo "value=internal" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Google Play
        if: ${{ github.event_name == 'push' || inputs.deploy }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.outnest
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || steps.track.outputs.value }}
          status: completed
