name: outnest
description: "A social Media App For Future of Socialising."
publish_to: "none"
version: 0.1.1

environment:
  sdk: ^3.8.1

dependencies:
  camera: ^0.12.0
  flutter:
    sdk: flutter
  app_links: ^7.0.0
  cloud_firestore: ^6.0.0
  cloud_functions: ^6.0.0
  collection: ^1.15.0
  equatable: ^2.0.7
  faker: ^2.2.0
  firebase_analytics: ^12.1.1
  firebase_app_check: ^0.4.0
  firebase_auth: ^6.0.1
  firebase_core: ^4.0.0
  firebase_crashlytics: ^5.0.0
  firebase_messaging: ^16.1.1
  firebase_performance: ^0.11.0
  firebase_remote_config: ^6.1.1
  firebase_storage: ^13.0.0
  flutter_holo_date_picker: ^2.0.0
  flutter_hooks: ^0.21.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_screenutil: ^5.9.3
  get_it: ^9.2.1
  go_router: ^17.0.1
  hooks_riverpod: ^3.3.1
  http: ^1.5.0
  image: ^4.5.4
  image_picker: ^1.2.0
  intl: ^0.20.2
  logger: ^2.6.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pinput: ^6.0.2
  smooth_page_indicator: ^2.0.1
  uuid: ^4.5.1
  timeago: ^3.7.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  fake_cloud_firestore: ^4.0.0
  dart_firebase_admin: ^0.4.1
  flutter_dotenv: ^6.0.0
  mapbox_maps_flutter: ^2.17.0
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.0.0
  dart_geohash: ^2.1.0
  device_info_plus: ^12.3.0
  dio: ^5.9.0
  cached_network_image: ^3.4.1
  mask_text_input_formatter: ^2.9.0
  url_launcher: ^6.3.2
  google_api_availability: ^5.0.1
  shared_preferences: ^2.5.4
  google_sign_in: ^7.2.0
  rxdart: ^0.28.0
  flutter_image_compress: ^2.4.0
  image_cropper: ^11.0.0
  recaptcha_enterprise_flutter: ^18.8.2
  geolocator: ^14.0.2
  flutter_speed_dial: ^7.0.0
  crypto: ^3.0.7
  encrypt: ^5.0.3
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0
  material_symbols_icons: ^4.2906.0
  share_plus: ^12.0.1
  avatar_glow: ^3.0.1
  fpdart: ^1.2.0
  video_player: ^2.11.1
  volume_controller: ^3.4.4



dev_dependencies:
  build_runner: ^2.7.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ^6.10.0
  lint_hard: ^6.1.1
  mocktail: ^1.0.4
  test: ^1.26.2
  very_good_analysis: ^10.2.0
 
flutter_launcher_icons:
  image_path: "assets/512logo.png"
  android: "ic_launcher"
  ios: true
  min_sdk_android: 26
  adaptive_icon_background: "#FFFFFF" # Arka plan rengi (Android için)
  adaptive_icon_foreground: "assets/512logo.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/remote_config_defaults.json
    - assets/map/
    - assets/badge/
    - assets/data/
    - assets/defaults/
    - .env
  fonts:
    - family: Agrandir
      fonts:
        - asset: fonts/Agrandir-Grand-Heavy-800.otf
          weight: 800
    - family: Grift
      fonts:
        - asset: fonts/Grift-Bold.ttf
          weight: 700



flutter_intl:
  enabled: true
