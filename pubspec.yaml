name: bulusalim
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  app_links: ^6.4.1
  cloud_firestore: ^6.0.0
  cloud_functions: ^6.0.0
  collection: ^1.15.0
  equatable: ^2.0.7
  faker: ^2.2.0
  firebase_analytics: ^12.0.4
  firebase_app_check: ^0.4.0
  firebase_auth: ^6.0.1
  firebase_core: ^4.0.0
  firebase_crashlytics: ^5.0.0
  firebase_messaging: ^16.0.0
  firebase_performance: ^0.11.0
  firebase_remote_config: ^6.1.1
  firebase_storage: ^13.0.0
  flutter_holo_date_picker: ^2.0.0
  flutter_hooks: ^0.21.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_screenutil: ^5.9.3
  get_it: ^8.2.0
  go_router: ^16.1.0
  hooks_riverpod: ^2.6.1
  http: ^1.5.0
  image: ^4.5.4
  image_picker: ^1.2.0
  intl: ^0.20.2
  logger: ^2.6.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pinput: ^5.0.1
  smooth_page_indicator: ^1.2.1
  uuid: ^4.5.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  build_runner: ^2.7.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.10.0
  mocktail: ^1.0.4
  test: ^1.26.2
  very_good_analysis: ^9.0.0

flutter_launcher_icons:
  image_path: "assets/blsmlogo.jpg"
  android: true
  ios: true
  min_sdk_android: 23
  web:
    generate: true
    image_path: "assets/blsmlogo.jpg"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/blsmlogo.jpg"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/blsmlogo.jpg"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/remote_config_defaults.json

flutter_intl:
  enabled: true
